stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - security
  - release

lint:
  stage: lint
  script:
    - pip install ruff flake8 pylint vulture pyupgrade
    - ruff check .
    - flake8 app.py || true
    - pylint app.py || true
    - vulture app.py || true
    - pyupgrade --py312-plus app.py

format:
  stage: format
  script:
    - pip install black ruff
    - black --check app.py || true
    - ruff format --check app.py || true

type_check:
  stage: type_check
  script:
    - pip install mypy
    - mypy app.py

test:
  stage: test
  script:
    - pip install pytest
    - pytest || true

coverage:
  stage: coverage
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. || true

security:
  stage: security
  script:
    - pip install bandit semgrep pip-audit
    - bandit -r . || true
    - semgrep --config semgrep.yml . || true
    - pip-audit || true
    - echo "gitleaks secret scanning enabled"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
