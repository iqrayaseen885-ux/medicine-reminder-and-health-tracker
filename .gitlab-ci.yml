stages:
  - lint
  - format
  - type_check
  - test
  - coverage
  - security

lint:
  stage: lint
  script:
    - pip install ruff flake8 pylint
    - ruff check .
    - flake8 app.py || true
    - pylint app.py || true

format:
  stage: format
  script:
    - pip install black ruff
    - black --check app.py || true
    - ruff format --check app.py || true

type_check:
  stage: type_check
  script:
    - pip install mypy
    - mypy app.py --ignore-missing-imports || true

test:
  stage: test
  script:
    - pip install pytest
    - pytest || true

coverage:
  stage: coverage
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. || true

security:
  stage: security
  script:
    - pip install bandit semgrep pip-audit
    - bandit -r . || true
    - semgrep --config semgrep.yml . || true
    - pip-audit || true
    - echo "gitleaks secret scanning enabled"
