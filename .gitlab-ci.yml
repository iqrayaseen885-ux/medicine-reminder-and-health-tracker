stages:
  - quality
  - security
  - test

lint:
  stage: quality
  script:
    - pip install ruff flake8 pylint vulture pyupgrade
    - ruff check .
    - flake8 app.py
    - pylint app.py || true
    - vulture app.py || true
    - pyupgrade --py312-plus app.py

type_check:
  stage: quality
  script:
    - pip install mypy
    - mypy app.py --ignore-missing-imports

security:
  stage: security
  script:
    - pip install bandit semgrep pip-audit
    - bandit -r .
    - semgrep --config semgrep.yml .
    - pip-audit || true
    - echo "gitleaks secret scanning enabled"

coverage:
  stage: test
  script:
    - pip install pytest pytest-cov
    - pytest --cov=. || true
